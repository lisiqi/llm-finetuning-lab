[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetuning-lab"
version = "0.1.0"
description = "Reproducible passage-grounded QA adaptation on Apple Silicon"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm[train]>=0.28,<0.31"]

[project.scripts]
finetuning-lab = "finetuning_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
